# Breek Market test networks.
# The direct suite (tests/direct, tests/consensus) runs in-process and does not
# touch the network; this file matters only when driving a live net from pytest.
networks:
  default: studionet
  studionet:
    url: https://studio.genlayer.com/api
    id: 61999
  localnet:
    url: http://127.0.0.1:4000/api
    id: 61999

paths:
  contracts: contracts
  artifacts: artifacts

environment: .env
