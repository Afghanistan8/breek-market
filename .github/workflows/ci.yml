name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    name: Contract - lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint the contract
        run: genvm-lint lint contracts/BreekMarket.py
      - name: Tests
        run: python -m pytest tests -q

  sources:
    name: Live settlement sources
    runs-on: ubuntu-latest
    # Probes real public endpoints. Kept non-blocking because a third-party
    # rate limit is not a defect in this repository -- on chain a 429 is simply
    # a TRANSIENT revert and the market stays resolvable.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe Gate.io and CoinGecko
        run: python scripts/check_sources.py --skip-hourly

  frontend:
    name: Frontend - typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
